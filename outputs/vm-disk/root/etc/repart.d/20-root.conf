# The root partition when the system runs: systemd-repart grows it into
# the free space after it at every boot, so a disk made bigger (at its
# copy, or later) is used; systemd-growfs-root then grows the file system
# (the partition's GPT flag 59, which the disk's repart.d sets by default).
# The ESP, which has no definition here, stays as it is.
[Partition]
Type=root
