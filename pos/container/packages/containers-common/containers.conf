# POS: podman's helpers are in /pos, which none of its built-in search
# paths name. /etc/containers/containers.conf and containers.conf.d
# override these.

[containers]
log_driver = "journald"
seccomp_profile = "/pos/share/containers/seccomp.json"

[engine]
runtime = "crun"
conmon_path = ["/pos/bin/conmon"]
init_path = "/pos/bin/catatonit"
# netavark, aardvark-dns and rootlessport; pasta in /pos/bin.
helper_binaries_dir = ["/pos/libexec/podman", "/pos/bin"]
hooks_dir = ["/pos/share/containers/oci/hooks.d", "/etc/containers/oci/hooks.d"]

[engine.runtimes]
crun = ["/pos/bin/crun"]

[network]
network_backend = "netavark"
