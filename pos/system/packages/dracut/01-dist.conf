# dracut's directories on POS, installed as
# /pos/lib/dracut/dracut.conf.d/01-dist.conf: dracut defaults to /usr
# paths; POS's systemd, udev and dbus have their files in /pos.
#
# libdirs: where dracut looks for libraries modules install by name
# (udev-rules: libkmod, which systemd and udevd dlopen; libnss_files).
# Detected, it misses /pos/lib: ldconfig_paths drops every cache entry under
# a directory named lib, meaning /lib and /usr/lib, which also matches
# /pos/lib. /usr/lib64 holds Fedora's libraries installed next to POS.
libdirs="/pos/lib /usr/lib64 /usr/lib"
environment=/pos/lib/environment.d
dbus=/pos/share/dbus-1
dbusinterfaces=/pos/share/dbus-1/interfaces
dbusservices=/pos/share/dbus-1/services
dbussession=/pos/share/dbus-1/session.d
dbussystem=/pos/share/dbus-1/system.d
dbussystemservices=/pos/share/dbus-1/system-services
sysctld=/pos/lib/sysctl.d
systemdutildir=/pos/lib/systemd
systemdcatalog=/pos/lib/systemd/catalog
systemdntpunits=/pos/lib/systemd/ntp-units.d
systemdportable=/pos/lib/systemd/portable
systemdsystemunitdir=/pos/lib/systemd/system
systemduser=/pos/lib/systemd/user
sysusers=/pos/lib/sysusers.d
tmpfilesdir=/pos/lib/tmpfiles.d
udevdir=/pos/lib/udev
